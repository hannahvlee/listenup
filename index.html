<style>
  :root {
    --bg: #0e0e0e;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #c8f060;
    --accent2: #60c8f0;
    --text: #f0ede8;
    --text-muted: #6e6e6e;
    --text-dim: #3e3e3e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 50% at 20% 20%, rgba(200,240,96,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(96,200,240,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    position: relative;
    z-index: 1;
    flex: 1;
  }

  .label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.1;
    margin-bottom: 8px;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 300;
    margin-bottom: 48px;
  }

  .track-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .track-section-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent2);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .track-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    color: var(--text);
    transition: all 0.2s;
    width: 100%;
  }

  .track-card:hover {
    border-color: var(--accent);
    background: rgba(200,240,96,0.04);
    transform: translateX(4px);
  }

  .track-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .track-num {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    min-width: 24px;
  }

  .track-title {
    font-size: 16px;
    font-weight: 400;
  }

  .track-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .track-arrow {
    font-size: 18px;
    color: var(--text-dim);
    transition: color 0.2s;
  }

  .track-card:hover .track-arrow {
    color: var(--accent);
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* 접속 암호 게이트 */
  #accessGate {
    position: fixed; inset: 0; z-index: 999;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  #accessGate .gate-box { width: 320px; max-width: 88vw; text-align: center; }
  #accessGate .gate-logo {
    font-family: 'DM Mono', monospace; font-size: 15px; color: var(--accent2);
    letter-spacing: 0.18em; font-weight: 700; margin-bottom: 28px;
  }
  #accessGate input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 16px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px;
    text-align: center; outline: none; letter-spacing: 0.1em; transition: border-color 0.2s;
    box-sizing: border-box;
  }
  #accessGate input:focus { border-color: var(--accent); }
  #accessGate input.shake { border-color: #f06060; animation: gateShake 0.3s; }
  @keyframes gateShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  #accessGate button {
    width: 100%; margin-top: 10px; padding: 13px; border-radius: 10px; border: none;
    background: var(--accent); color: #0e0e0e; font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
  #accessGate .gate-error {
    margin-top: 12px; font-size: 12px; color: #f06060; display: none;
  }

  /* Top-level 리스닝/스피킹 tabs */
  .top-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--border);
  }
  .top-tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 6px 16px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    margin-right: 20px;
  }
  .top-tab .t-icon { font-size: 16px; opacity: 0.6; }
  .top-tab.active { color: var(--text); }
  .top-tab.active.listening { border-color: var(--accent2); }
  .top-tab.active.listening .t-icon { opacity: 1; }
  .top-tab.active.speaking { border-color: var(--accent); }
  .top-tab.active.speaking .t-icon { opacity: 1; }
  .top-tab:hover { color: var(--text); }

  .top-panel { display: none; }
  .top-panel.active { display: block; }

  .speaking-card:hover { border-color: var(--accent); background: rgba(200,240,96,0.04); }
  .speaking-card:hover .track-arrow { color: var(--accent); }

  #speakingList {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  #speakingList .track-card {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 16px 16px;
  }
  #speakingList .track-left { flex-direction: column; align-items: flex-start; gap: 4px; }
  #speakingList .track-title { font-size: 16px; font-weight: 500; }
  #speakingList .track-count { font-size: 10px; }
</style>

<body>
<div id="accessGate">
  <div class="gate-box">
    <div class="gate-logo">🎧 ListenUp!</div>
    <input type="password" id="gateInput" placeholder="암호를 입력하세요" autocomplete="off" inputmode="numeric">
    <button onclick="checkGate()">입장</button>
    <div class="gate-error" id="gateError">암호가 올바르지 않아요</div>
  </div>
</div>
<script>
  (function() {
    const GATE_KEY = 'lu_access_ok';
    const GATE_PASSWORD = '1202';
    if (localStorage.getItem(GATE_KEY) === '1') {
      document.getElementById('accessGate') && (document.getElementById('accessGate').style.display = 'none');
    }
    window.checkGate = function() {
      const input = document.getElementById('gateInput');
      const err = document.getElementById('gateError');
      if (input.value.trim() === GATE_PASSWORD) {
        localStorage.setItem(GATE_KEY, '1');
        document.getElementById('accessGate').style.display = 'none';
      } else {
        err.style.display = 'block';
        input.classList.remove('shake');
        void input.offsetWidth;
        input.classList.add('shake');
        input.value = '';
        input.focus();
      }
    };
    window.addEventListener('DOMContentLoaded', function() {
      const input = document.getElementById('gateInput');
      if (input) {
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') checkGate();
        });
      }
    });
  })();
</script>

<script>
  let currentMode = 'listening';

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('mode-shadowing').style.borderColor = mode === 'shadowing' ? 'var(--accent)' : 'var(--border)';
    document.getElementById('mode-listening').style.borderColor = mode === 'listening' ? 'var(--accent)' : 'var(--border)';
    document.getElementById('mode-dictation').style.borderColor = mode === 'dictation' ? 'var(--accent)' : 'var(--border)';
    document.getElementById('mode-vocab').style.borderColor = mode === 'vocab' ? 'var(--accent)' : 'var(--border)';
    renderTracks();
    return false;
  }

  let hiddenTrackIds = [];
  let trackSettings = {};

  async function loadAndRender() {
    try {
      const r = await fetch('/api/admin-update-tracks');
      const data = await r.json();
      hiddenTrackIds = data.hiddenTracks || [];
      trackSettings = data.trackSettings || {};
    } catch(e) {
      hiddenTrackIds = [];
      trackSettings = {};
    }
    renderTracks();
  }

  // toefl_type 값을 'new' / 'old' / null(미설정,인식불가)로 정규화
  function classifyToeflType(raw) {
    if (!raw) return null;
    const s = String(raw).trim();
    const lower = s.toLowerCase();
    if (lower.includes('new') || s.includes('뉴')) return 'new';
    if (lower.includes('old') || s.includes('구')) return 'old';
    return null;
  }

  function buildTrackCard(track) {
    const a = document.createElement('a');
    a.className = 'track-card';
    const href = currentMode === 'shadowing' ? `player.html?id=${track.id}` :
                 currentMode === 'listening' ? `listening.html?id=${track.id}` :
                 currentMode === 'dictation' ? `dictation.html?id=${track.id}` :
                 `vocab.html?id=${track.id}`;
    a.href = href;
    a.innerHTML = `
      <div class="track-left">
        <span class="track-num">${String(track.id).padStart(2, '0')}</span>
        <span class="track-title">${track.title}</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <span class="track-count">${track.sentences.length} sentences</span>
        <span class="track-arrow">→</span>
      </div>
    `;
    return a;
  }

  function renderTracks() {
    const listNewEl = document.getElementById('trackList-new');
    const listOldEl = document.getElementById('trackList-old');
    listNewEl.innerHTML = '';
    listOldEl.innerHTML = '';

    const visibleTracks = TRACKS
      .filter(t => !hiddenTrackIds.includes(Number(t.id)))
      .sort((a, b) => {
        const ao = trackSettings[a.id]?.sort_order ?? 9999;
        const bo = trackSettings[b.id]?.sort_order ?? 9999;
        return ao !== bo ? ao - bo : b.id - a.id;
      });

    const newTracks = [];
    const oldTracks = [];
    visibleTracks.forEach(track => {
      const type = classifyToeflType(trackSettings[track.id]?.toefl_type);
      if (type === 'new') newTracks.push(track);
      else if (type === 'old') oldTracks.push(track);
      // toefl_type이 없거나 인식되지 않는 트랙은 두 섹션 모두에서 제외됨
    });

    newTracks.forEach(track => listNewEl.appendChild(buildTrackCard(track)));
    oldTracks.forEach(track => listOldEl.appendChild(buildTrackCard(track)));

    document.getElementById('section-new').style.display = newTracks.length ? '' : 'none';
    document.getElementById('section-old').style.display = oldTracks.length ? '' : 'none';
  }

  // 사용자 이름 표시
  _supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      const name = session.user?.user_metadata?.full_name || session.user?.email || '';
      document.getElementById('userNameBtn').textContent = name;
    }
  });

  async function logout() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
  }

  loadAndRender();

  // ===================== 리스닝/스피킹 대분류 탭 =====================
  function switchTop(which) {
    document.getElementById('toptab-listening').classList.toggle('active', which === 'listening');
    document.getElementById('toptab-speaking').classList.toggle('active', which === 'speaking');
    document.getElementById('panel-listening').classList.toggle('active', which === 'listening');
    document.getElementById('panel-speaking').classList.toggle('active', which === 'speaking');
  }

  let hiddenSpeakingTrackIds = [];

  async function loadSpeakingList() {
    try {
      const r = await fetch('/api/admin-update-tracks?type=speaking');
      const data = await r.json();
      hiddenSpeakingTrackIds = data.hiddenTracks || [];
    } catch(e) {
      hiddenSpeakingTrackIds = [];
    }
    renderSpeakingList();
  }

  function renderSpeakingList() {
    const list = document.getElementById('speakingList');
    list.innerHTML = '';
    const tests = (typeof SPEAKING_TESTS !== 'undefined' ? SPEAKING_TESTS : [])
      .filter(t => !hiddenSpeakingTrackIds.includes(Number(t.id)))
      .slice()
      .sort((a, b) => a.id - b.id);
    tests.forEach(t => {
      const a = document.createElement('a');
      a.className = 'track-card speaking-card';
      a.href = `speaking.html?id=${t.id}`;
      a.innerHTML = `
        <div class="track-left">
          <span class="track-num">${String(t.id).padStart(2,'0')}</span>
          <span class="track-title">${t.title}</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px">
          <span class="track-count">${t.sentences.length} sentences</span>
          <span class="track-arrow">→</span>
        </div>
      `;
      list.appendChild(a);
    });
  }

  loadSpeakingList();
</script>
