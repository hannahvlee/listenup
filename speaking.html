<style>
  :root {
    --bg: #0e0e0e;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #c8f060;
    --accent2: #60c8f0;
    --text: #f0ede8;
    --text-muted: #6e6e6e;
    --text-dim: #3e3e3e;
    --danger: #f06060;
    --success: #60f0a0;
    --warn: #f0c060;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 50% at 20% 20%, rgba(200,240,96,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(96,200,240,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    position: relative;
    z-index: 1;
  }

  header { margin-bottom: 24px; }

  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    color: var(--accent2);
    letter-spacing: 0.18em;
    font-weight: 700;
    display: block;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
  }

  h1 {
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(24px, 5vw, 34px);
    margin-bottom: 8px;
  }

  .subtitle { font-size: 14px; color: var(--text-muted); font-weight: 300; }

  .section-tabs { display: flex; gap: 8px; margin: 20px 0 32px; }
  .section-tab {
    flex: 1; text-align: center; padding: 12px 16px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--surface); color: var(--text-muted);
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .section-tab .tab-desc { display: block; font-size: 11px; font-weight: 300; color: var(--text-dim); margin-top: 2px; }
  .section-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(200,240,96,0.06); }
  .section-tab.active .tab-desc { color: var(--accent); opacity: 0.7; }

  .intro-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 32px 28px; text-align: center; margin-top: 24px;
  }
  .intro-card .icon { font-size: 40px; margin-bottom: 16px; }
  .intro-card h2 { font-size: 18px; font-weight: 500; margin-bottom: 10px; }
  .intro-card p { font-size: 13px; color: var(--text-muted); line-height: 1.7; margin-bottom: 24px; }

  .btn-primary {
    padding: 13px 32px; border-radius: 10px; border: none; background: var(--accent);
    color: #0e0e0e; font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

  .progress-track { display: flex; gap: 6px; margin-bottom: 28px; }
  .progress-seg { flex: 1; height: 4px; border-radius: 2px; background: var(--border); transition: background 0.3s; }
  .progress-seg.done { background: var(--accent); }
  .progress-seg.active { background: var(--accent2); }

  .stage-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 40px 28px; text-align: center; min-height: 220px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .stage-num { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; }
  .stage-icon { font-size: 36px; }

  .stage-label.listening { color: var(--accent2); }
  .stage-label.recording { color: var(--danger); }

  .results-list { display: flex; flex-direction: column; gap: 10px; }
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
  .result-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); min-width: 20px; }
  .result-body { flex: 1; }
  .result-text { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; line-height: 1.5; }
  .result-said { font-size: 12px; color: var(--text-dim); font-style: italic; }

  .btn-sm-play {
    margin-top: 8px; padding: 5px 12px; font-size: 11px; border-radius: 20px;

  }
  .btn-sm-play:hover:not(:disabled) { border-color: var(--accent2); color: var(--accent2); }
  .btn-sm-play:disabled { opacity: 0.5; cursor: default; }

  .result-score { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; min-width: 54px; text-align: right; }
  .result-score.high { color: var(--success); }
  .result-score.mid { color: var(--warn); }
  .result-score.low { color: var(--danger); }

  .practice-controls { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 16px; }
  .blur-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); cursor: pointer; user-select: none; }
  .toggle-switch { width: 36px; height: 20px; background: var(--border); border-radius: 10px; position: relative; transition: background 0.2s; }
  .toggle-switch::after { content: ''; position: absolute; width: 14px; height: 14px; background: var(--text-muted); border-radius: 50%; top: 3px; left: 3px; transition: all 0.2s; }
  .toggle-switch.on { background: rgba(200,240,96,0.2); }
  .toggle-switch.on::after { left: 19px; background: var(--accent); }

  .practice-list { display: flex; flex-direction: column; gap: 10px; }
  .practice-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; transition: all 0.2s; }
  .practice-card.pass { border-color: rgba(96,240,160,0.3); }
  .practice-card.fail { border-color: rgba(240,96,96,0.3); }

  .p-card-top { display: flex; align-items: flex-start; gap: 12px; }
  .p-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); padding-top: 3px; min-width: 20px; }
  .p-text { flex: 1; font-size: 15px; line-height: 1.6; color: var(--text); font-weight: 300; }
  .p-text.blur-text { filter: blur(5px); user-select: none; transition: filter 0.3s; }

  .p-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent2); color: var(--accent2); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-record { color: var(--text-muted); padding: 7px 10px; }
  .btn-record:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .btn-record.recording { border-color: var(--danger); color: var(--danger); background: rgba(240,96,96,0.1); animation: pulse-red 1s infinite; }
  @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(240,96,96,0.3); } 50% { box-shadow: 0 0 0 4px rgba(240,96,96,0); } }

  .p-result-bar { margin-top: 12px; display: none; padding-top: 12px; border-top: 1px solid var(--border); }
  .p-result-bar.show { display: block; }
  .p-result-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .p-score-badge { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; padding: 4px 12px; border-radius: 20px; }
  .p-score-badge.high { background: rgba(96,240,160,0.15); color: var(--success); border: 1px solid rgba(96,240,160,0.3); }
  .p-score-badge.mid { background: rgba(240,192,96,0.12); color: var(--warn); border: 1px solid rgba(240,192,96,0.3); }
  .p-score-badge.low { background: rgba(240,96,96,0.12); color: var(--danger); border: 1px solid rgba(240,96,96,0.3); }
  .p-score-detail { font-size: 12px; color: var(--text-muted); flex: 1; font-style: italic; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>

<audio id="mainAudio" style="display:none"></audio>

<script>
const params = new URLSearchParams(window.location.search);
const testId = parseInt(params.get('id')) || 1;
const test = SPEAKING_TESTS.find(t => t.id === testId) || SPEAKING_TESTS[0];
const SENTENCES = test.sentences; // [{id, text, file}]

document.getElementById('testTitle').textContent = `리슨앤리핏 · ${test.title}`;

const MIN_VALID_RECORDING = 0.5;
let sharedStream = null;
const mainAudio = document.getElementById('mainAudio');

async function ensureStream() {
  if (sharedStream && sharedStream.getTracks().some(t => t.readyState === 'live')) return sharedStream;
  sharedStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  return sharedStream;
}

function playSentenceAudio(fileUrl) {
  return new Promise((resolve) => {
    mainAudio.src = fileUrl;
    mainAudio.onended = resolve;
    mainAudio.onerror = resolve;
    mainAudio.play().catch(resolve);
  });
}

function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

function playBeep() {
  return new Promise(resolve => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const beepDuration = 0.8;
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.03);
    gain.gain.setValueAtTime(0.2, ctx.currentTime + beepDuration - 0.08);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + beepDuration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + beepDuration);
    osc.onended = () => { ctx.close(); resolve(); };
  });
}

function switchSection(section) {
  document.getElementById('tab-practice').classList.toggle('active', section === 'practice');
  document.getElementById('tab-exam').classList.toggle('active', section === 'exam');
  document.getElementById('practiceSection').style.display = section === 'practice' ? 'block' : 'none';
  document.getElementById('examSection').style.display = section === 'exam' ? 'block' : 'none';
}

// ===================== 연습 파트 =====================
let practiceBlur = false;
const practiceRecordings = {};
let practiceRecorder = null;
let practiceRecordingIndex = null;

function renderPractice() {
  const list = document.getElementById('practiceList');
  list.innerHTML = '';
  SENTENCES.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'practice-card';
    card.id = `p-card-${i}`;
    card.innerHTML = `
      <div class="p-card-top">
        <span class="p-num">${String(i+1).padStart(2,'0')}</span>
        <span class="p-text${practiceBlur ? ' blur-text' : ''}" id="p-text-${i}">${s.text}</span>
        <div class="p-actions">
          <button class="btn" id="p-play-${i}" onclick="practicePlay(${i})">▶ 듣기</button>
          <button class="btn btn-record" id="p-rec-${i}" onclick="practiceToggleRecord(${i})" title="녹음">⏺</button>
        </div>
      </div>
      <div class="p-result-bar" id="p-result-${i}">
        <div class="p-result-row">
          <span class="p-score-badge" id="p-badge-${i}"></span>
          <span class="p-score-detail" id="p-detail-${i}"></span>
          <button class="btn-sm-play" id="p-mine-${i}" onclick="practicePlayMine(${i})" style="display:none">▶ 내 목소리</button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

async function practicePlay(i) {
  const btn = document.getElementById(`p-play-${i}`);
  btn.disabled = true;
  btn.textContent = '🔊 재생 중...';
  await playSentenceAudio(SENTENCES[i].file);
  btn.disabled = false;
  btn.textContent = '▶ 듣기';
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('blurToggle').addEventListener('click', () => {
    practiceBlur = !practiceBlur;
    document.getElementById('toggleSwitch').classList.toggle('on', practiceBlur);
    document.querySelectorAll('.p-text').forEach(el => el.classList.toggle('blur-text', practiceBlur));
  });
  renderPractice();
});

async function practiceToggleRecord(i) {
  const btn = document.getElementById(`p-rec-${i}`);
  if (practiceRecordingIndex === i) { practiceRecorder?.stop(); return; }
  if (practiceRecordingIndex !== null) return;

  let stream;
  try { stream = await ensureStream(); }
  catch (e) { alert('마이크 접근이 거부되었어요. 브라우저 설정에서 마이크 권한을 허용해주세요.'); return; }

  practiceRecordingIndex = i;
  btn.classList.add('recording');
  btn.title = '중지';

  const badge = document.getElementById(`p-badge-${i}`);
  const detail = document.getElementById(`p-detail-${i}`);
  const resultBar = document.getElementById(`p-result-${i}`);
  resultBar.classList.add('show');
  badge.className = 'p-score-badge';
  badge.textContent = '🎙 듣는 중...';
  detail.textContent = '';

  const chunks = [];
  const mr = new MediaRecorder(stream);
  practiceRecorder = mr;
  const recordStartTime = Date.now();

  let finalTranscript = '';
  let recognition = null;
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = (e) => {
      let interim = '';
      finalTranscript = '';
      for (let r of e.results) {
        if (r.isFinal) finalTranscript += r[0].transcript;
        else interim += r[0].transcript;
      }
      detail.textContent = `"${(finalTranscript || interim).trim()}"`;
    };
    recognition.start();
  }

  mr.ondataavailable = e => chunks.push(e.data);
  mr.onstop = () => {
    if (recognition) { try { recognition.stop(); } catch(e) {} }
    const recordedSeconds = (Date.now() - recordStartTime) / 1000;

    if (chunks.length) {
      const blob = new Blob(chunks, { type: 'audio/webm' });
      practiceRecordings[i] = URL.createObjectURL(blob);
      document.getElementById(`p-mine-${i}`).style.display = 'inline-block';
    }

    setTimeout(() => {
      practiceShowResult(i, finalTranscript.trim(), recordedSeconds);
      practiceRecordingIndex = null;
      btn.classList.remove('recording');
      btn.title = '녹음';
    }, 300);
  };

  mr.start();
  setTimeout(() => { if (practiceRecordingIndex === i && mr.state !== 'inactive') mr.stop(); }, 15000);
}

function practiceShowResult(i, transcript, recordedSeconds) {
  const badge = document.getElementById(`p-badge-${i}`);
  const detail = document.getElementById(`p-detail-${i}`);
  const card = document.getElementById(`p-card-${i}`);

  if (recordedSeconds < MIN_VALID_RECORDING) {
    badge.textContent = '녹음 실패';
    badge.className = 'p-score-badge low';
    detail.textContent = '너무 짧게 녹음됐어요. 다시 시도해주세요.';
    return;
  }

  const rawScore = transcript ? similarity(transcript, SENTENCES[i].text) : 0;
  const score = Math.round(rawScore * 6 * 100) / 100;
  const cls = score >= 4.5 ? 'high' : score >= 2.5 ? 'mid' : 'low';

  badge.textContent = score.toFixed(2);
  badge.className = `p-score-badge ${cls}`;
  detail.textContent = transcript ? `"${transcript}"` : '(인식 안됨)';

  card.classList.remove('pass', 'fail');
  card.classList.add(score >= 4.5 ? 'pass' : 'fail');
}

function practicePlayMine(i) {
  if (!practiceRecordings[i]) return;
  const btn = document.getElementById(`p-mine-${i}`);
  const player = new Audio(practiceRecordings[i]);
  btn.textContent = '▶ 재생 중...';
  btn.disabled = true;
  player.play();
  player.onended = () => { btn.textContent = '▶ 내 목소리'; btn.disabled = false; };
}

// ===================== 시험 파트 =====================
function responseTimeFor(i) {
  if (i <= 1) return 8;
  if (i <= 4) return 10;
  return 12;
}

let currentIndex = 0;
const examResults = [];
const examRecordingUrls = {};

function renderProgress() {
  const track = document.getElementById('progressTrack');
  track.innerHTML = '';
  SENTENCES.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'progress-seg';
    if (i < currentIndex) seg.classList.add('done');
    else if (i === currentIndex) seg.classList.add('active');
    track.appendChild(seg);
  });
}

async function startTest() {
  try { await ensureStream(); }
  catch (e) { alert('마이크 접근이 거부되었어요. 브라우저 설정에서 마이크 권한을 허용해주세요.'); return; }

  gtag('event', 'practice_start', { mode: '리슨앤리핏_시험', track: test.title });

  document.getElementById('introScreen').style.display = 'none';
  document.getElementById('testScreen').style.display = 'block';
  currentIndex = 0;
  examResults.length = 0;
  runSentence(currentIndex);
}

function setStage(icon, label, cls) {
  document.getElementById('stageIcon').textContent = icon;
  const labelEl = document.getElementById('stageLabel');
  labelEl.textContent = label;
  labelEl.className = 'stage-label ' + (cls || '');
}

async function runSentence(i) {
  renderProgress();
  document.getElementById('stageNum').textContent = `문장 ${i + 1} / ${SENTENCES.length}`;

  setStage('🔊', '재생 중...', 'listening');
  await playSentenceAudio(SENTENCES[i].file);

  setStage('　', '', '');
  await wait(500);

  setStage('🔔', '띠이이 —', 'listening');
  await playBeep();

  await recordAndScore(i);

  currentIndex++;
  if (currentIndex < SENTENCES.length) setTimeout(() => runSentence(currentIndex), 600);
  else setTimeout(showResults, 600);
}

function recordAndScore(i) {
  return ensureStream().then(stream => new Promise(resolve => {
    const duration = responseTimeFor(i);
    const chunks = [];
    const mr = new MediaRecorder(stream);
    const recordStartTime = Date.now();

    let finalTranscript = '';
    let recognition = null;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.onresult = (e) => {
        finalTranscript = '';
        for (let r of e.results) { if (r.isFinal) finalTranscript += r[0].transcript; }
      };
      recognition.start();
    }

    mr.ondataavailable = e => chunks.push(e.data);

    let remaining = duration;
    setStage('⏺', `녹음 중 · ${remaining}초`, 'recording');
    const countdownTimer = setInterval(() => {
      remaining--;
      if (remaining > 0) setStage('⏺', `녹음 중 · ${remaining}초`, 'recording');
    }, 1000);

    mr.onstop = () => {
      clearInterval(countdownTimer);
      if (recognition) { try { recognition.stop(); } catch(e) {} }
      const recordedSeconds = (Date.now() - recordStartTime) / 1000;

      if (chunks.length) {
        const blob = new Blob(chunks, { type: 'audio/webm' });
        examRecordingUrls[i] = URL.createObjectURL(blob);
      }

      setTimeout(() => {
        if (recordedSeconds < MIN_VALID_RECORDING) {
          examResults.push({ text: SENTENCES[i].text, said: null, score: null, invalid: true });
        } else {
          const transcript = finalTranscript.trim();
          const rawScore = transcript ? similarity(transcript, SENTENCES[i].text) : 0;
          const score = Math.round(rawScore * 6 * 100) / 100;
          examResults.push({ text: SENTENCES[i].text, said: transcript || '(인식 안됨)', score, invalid: false });
        }
        resolve();
      }, 300);
    };

    mr.start();
    setTimeout(() => { if (mr.state !== 'inactive') mr.stop(); }, duration * 1000);
  }));
}

function showResults() {
  document.getElementById('testScreen').style.display = 'none';
  const resultsScreen = document.getElementById('resultsScreen');
  const list = document.getElementById('resultsList');
  list.innerHTML = '';

  examResults.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'result-card';

    if (r.invalid) {
      card.innerHTML = `
        <div class="result-num">${String(i+1).padStart(2,'0')}</div>
        <div class="result-body">
          <div class="result-text">${r.text}</div>
          <div class="result-said">녹음이 제대로 되지 않았어요</div>
        </div>
        <div class="result-score" style="color:var(--text-dim)">—</div>
      `;
    } else {
      const cls = r.score >= 4.5 ? 'high' : r.score >= 2.5 ? 'mid' : 'low';
      const hasAudio = !!examRecordingUrls[i];
      card.innerHTML = `
        <div class="result-num">${String(i+1).padStart(2,'0')}</div>
        <div class="result-body">
          <div class="result-text">${r.text}</div>
          <div class="result-said">"${r.said}"</div>
          ${hasAudio ? `<button class="btn-sm-play" onclick="playExamRecording(${i}, this)">▶ 내 목소리 듣기</button>` : ''}
        </div>
        <div class="result-score ${cls}">${r.score.toFixed(2)}</div>
      `;
    }
    list.appendChild(card);
  });

  resultsScreen.style.display = 'block';
}

function playExamRecording(i, btnEl) {
  if (!examRecordingUrls[i]) return;
  const player = new Audio(examRecordingUrls[i]);
  btnEl.textContent = '▶ 재생 중...';
  btnEl.disabled = true;
  player.play();
  player.onended = () => { btnEl.textContent = '▶ 내 목소리 듣기'; btnEl.disabled = false; };
}

let isSaving = false;
async function saveExamRecord() {
  if (isSaving) return;
  isSaving = true;
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = '저장 중...';

  const name = (_currentUser?.user_metadata?.full_name || _currentUser?.email || '익명');
  const progress = `${examResults.filter(r => !r.invalid).length}/${SENTENCES.length}문장`;

  try {
    await fetch('/api/records', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: _currentUser?.email,
        name,
        track: test.title,
        mode: '리슨앤리핏',
        score: null, // 평균 없음 — 문장별 점수만 details에 저장
        progress,
        textVisible: false,
        details: examResults.map((r, i) => ({
          index: i,
          text: r.text,
          userSaid: r.said || '',
          score: r.invalid ? null : r.score
        }))
      })
    });
    window.location.href = 'mypage.html';
  } catch (e) {
    alert('저장 중 오류가 발생했어요.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit';
    isSaving = false;
  }
}

// ---- similarity() — 쉐도잉 player.html에서 그대로 가져온 채점 로직 ----
function similarity(a, b) {
  const normalize = s => s.toLowerCase()
    .replace(/['']/g, "'")
    .replace(/won't/g, 'will not').replace(/can't/g, 'cannot')
    .replace(/n't/g, ' not').replace(/'re/g, ' are').replace(/'ve/g, ' have')
    .replace(/'ll/g, ' will').replace(/'d/g, ' would').replace(/'m/g, ' am')
    .replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();

  const wa = normalize(a).split(' ');
  const wb = normalize(b).split(' ');

  let covered = 0;
  const usedSpoken = new Array(wa.length).fill(false);
  for (const orig of wb) {
    let best = 0, bestIdx = -1;
    for (let k = 0; k < wa.length; k++) {
      if (usedSpoken[k]) continue;
      const s = wordSim(wa[k], orig);
      if (s > best) { best = s; bestIdx = k; }
    }
    if (best > 0.6) { covered += best; if (bestIdx >= 0) usedSpoken[bestIdx] = true; }
  }
  const recall = covered / wb.length;

  const matchedIndices = [];
  const usedB = new Array(wb.length).fill(false);
  for (let k = 0; k < wa.length; k++) {
    for (let m = 0; m < wb.length; m++) {
      if (usedB[m] && wordSim(wa[k], wb[m]) > 0.7) { matchedIndices.push(m); usedB[m] = true; break; }
    }
  }
  let orderScore = 1.0;
  if (matchedIndices.length > 1) {
    let inversions = 0;
    for (let x = 0; x < matchedIndices.length - 1; x++)
      for (let y = x + 1; y < matchedIndices.length; y++)
        if (matchedIndices[x] > matchedIndices[y]) inversions++;
    const maxInv = matchedIndices.length * (matchedIndices.length - 1) / 2;
    orderScore = maxInv > 0 ? 1 - (inversions / maxInv) : 1;
  }

  let strictCovered = 0;
  for (const orig of wb) {
    let best = 0;
    for (const w of wa) { const s = wordSim(w, orig); if (s > best) best = s; }
    if (best > 0.75) strictCovered += best;
  }
  const strictRecall = strictCovered / wb.length;

  return recall * 0.35 + strictRecall * 0.45 + orderScore * 0.20;
}

function wordSim(a, b) {
  if (a === b) return 1;
  if (!a || !b) return 0;
  if (Math.abs(a.length - b.length) > Math.max(a.length, b.length) * 0.5) return 0;
  const dist = editDistance(a, b);
  const maxLen = Math.max(a.length, b.length);
  const raw = 1 - dist / maxLen;
  const lengthPenalty = maxLen <= 3 ? 1.2 : 1.0;
  return Math.max(0, raw / lengthPenalty);
}

function editDistance(a, b) {
  const dp = Array.from({length: a.length + 1}, (_, i) =>
    Array.from({length: b.length + 1}, (_, j) => i === 0 ? j : j === 0 ? i : 0)
  );
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[a.length][b.length];
}
